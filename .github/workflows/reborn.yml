name: REBORN architecture

on:
  push:
    paths:
      - "src/SaintSeiyaNesReborn.Reborn.*/**"
      - "tests/SaintSeiyaNesReborn.Reborn.SelfTest/**"
      - "docs/reborn/**"
      - "docs/PROJECT_STATE.md"
      - ".github/workflows/reborn.yml"
  pull_request:
    paths:
      - "src/SaintSeiyaNesReborn.Reborn.*/**"
      - "tests/SaintSeiyaNesReborn.Reborn.SelfTest/**"
      - "docs/reborn/**"
      - "docs/PROJECT_STATE.md"
      - ".github/workflows/reborn.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build frozen OriginalSpec independently
        run: dotnet build src/SaintSeiyaNesReborn.OriginalSpec/SaintSeiyaNesReborn.OriginalSpec.csproj --configuration Release

      - name: Build REBORN Core
        run: dotnet build src/SaintSeiyaNesReborn.Reborn.Core/SaintSeiyaNesReborn.Reborn.Core.csproj --configuration Release

      - name: Build ORIGINAL SPEC bridge
        run: dotnet build src/SaintSeiyaNesReborn.Reborn.OriginalBridge/SaintSeiyaNesReborn.Reborn.OriginalBridge.csproj --configuration Release

      - name: Reject NES hardware leakage into REBORN Core
        shell: bash
        run: |
          if grep -R -nE '\$[0-9A-Fa-f]{4}|0x[89A-Fa-f][0-9A-Fa-f]{3}|CanonicalMessageEntrypoint|OriginalSpec' src/SaintSeiyaNesReborn.Reborn.Core --include='*.cs'; then
            echo "NES-facing implementation detail leaked into REBORN Core. Put translation in Reborn.OriginalBridge."
            exit 1
          fi

      - name: Run REBORN architecture self-test
        run: dotnet run --project tests/SaintSeiyaNesReborn.Reborn.SelfTest/SaintSeiyaNesReborn.Reborn.SelfTest.csproj --configuration Release
